site_name: Lazydocker for Mere Mortals
site_description: A terminal dashboard for Docker that puts your containers, images, volumes and networks on one screen. Installing lazydocker, reading its panels and tabs, following logs and live statistics, meeting its compose project view, shaping it with one config file, and the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/lazydocker-for-mere-mortals/
